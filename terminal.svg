<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230">
  <style>
    text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 16px; fill: #00FF41; }
    .dim { fill: #00B32C; }
    .r { width: 0; height: 26px; }
    .r1 { animation: t1 .8s steps(8) .4s forwards; }
    .r2 { animation: t2 1.2s steps(17) 1.5s forwards; }
    .r3 { animation: t3 1.2s steps(15) 3s forwards; }
    .r4 { animation: t4 2.4s steps(44) 4.4s forwards; }
    .r5 { animation: t5 1.6s steps(24) 7.2s forwards; }
    @keyframes t1 { to { width: 90px; } }
    @keyframes t2 { to { width: 170px; } }
    @keyframes t3 { to { width: 160px; } }
    @keyframes t4 { to { width: 440px; } }
    @keyframes t5 { to { width: 250px; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="c1"><rect class="r r1" x="30" y="55" /></clipPath>
    <clipPath id="c2"><rect class="r r2" x="30" y="85" /></clipPath>
    <clipPath id="c3"><rect class="r r3" x="30" y="115" /></clipPath>
    <clipPath id="c4"><rect class="r r4" x="30" y="145" /></clipPath>
    <clipPath id="c5"><rect class="r r5" x="30" y="175" /></clipPath>
  </defs>

  <!-- Ventana -->
  <rect x="1" y="1" width="798" height="228" rx="10" fill="#000" stroke="#00FF41" stroke-width="2"/>
  <rect x="1" y="1" width="798" height="34" rx="10" fill="#0a1a0f"/>
  <circle cx="24" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="18" r="6" fill="#27C93F"/>
  <text x="400" y="23" text-anchor="middle" class="dim" style="font-size:13px">luis@github: ~</text>

  <!-- Líneas -->
  <text x="30" y="73" clip-path="url(#c1)">$ whoami</text>
  <text x="30" y="103" clip-path="url(#c2)" class="dim">luis-mario-suarez</text>
  <text x="30" y="133" clip-path="url(#c3)">$ cat stack.txt</text>
  <text x="30" y="163" clip-path="url(#c4)" class="dim">JavaScript · Node.js · NestJS · Python · SQL</text>
  <text x="30" y="193" clip-path="url(#c5)">$ status --now: building_</text>
  <rect class="cursor" x="285" y="179" width="10" height="18" fill="#00FF41"/>
</svg>
