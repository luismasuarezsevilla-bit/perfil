<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <style>
    text { font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1s ease-in-out infinite; }
    @keyframes eq { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }
    .groove { animation: groove 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes groove { 0%, 100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-4px); } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b0a3d"/>
      <stop offset="100%" stop-color="#5b1a6e"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="3" y="3" width="794" height="244" rx="18" fill="url(#bg)" stroke="#FF2E88" stroke-width="4"/>

  <!-- Vinilo -->
  <g class="spin">
    <circle cx="140" cy="125" r="92" fill="#111"/>
    <circle cx="140" cy="125" r="76" fill="none" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="140" cy="125" r="62" fill="none" stroke="#2a2a2a" stroke-width="2"/>
    <circle cx="140" cy="125" r="50" fill="none" stroke="#2a2a2a" stroke-width="2"/>
    <path d="M140 125 L205 70 A92 92 0 0 1 225 100 Z" fill="#fff" opacity="0.08"/>
    <circle cx="140" cy="125" r="30" fill="#FF8A00"/>
    <circle cx="140" cy="125" r="22" fill="none" stroke="#FFD400" stroke-width="3"/>
    <circle cx="140" cy="125" r="5" fill="#2b0a3d"/>
  </g>

  <!-- Texto -->
  <g class="groove">
    <text x="270" y="85" font-size="60" font-weight="900" fill="#FFD400" stroke="#FF2E88" stroke-width="3" paint-order="stroke">FUNKY DEV</text>
  </g>
  <text x="272" y="122" font-size="26" font-weight="700" fill="#ffffff">Luis Mario Suarez</text>
  <text x="272" y="150" font-size="17" font-weight="600" fill="#00E5C7">QA · Código limpio · Datos</text>
  <text x="272" y="174" font-size="15" fill="#FF8A00">JavaScript · Node.js · NestJS · Python · SQL</text>

  <!-- Ecualizador -->
  <g>
    <rect class="bar" x="272" y="190" width="16" height="40" rx="4" fill="#FF2E88" style="animation-delay:0s;animation-duration:.9s"/>
    <rect class="bar" x="296" y="190" width="16" height="40" rx="4" fill="#FF8A00" style="animation-delay:.15s;animation-duration:1.1s"/>
    <rect class="bar" x="320" y="190" width="16" height="40" rx="4" fill="#FFD400" style="animation-delay:.3s;animation-duration:.8s"/>
    <rect class="bar" x="344" y="190" width="16" height="40" rx="4" fill="#00E5C7" style="animation-delay:.45s;animation-duration:1.2s"/>
    <rect class="bar" x="368" y="190" width="16" height="40" rx="4" fill="#FF2E88" style="animation-delay:.6s;animation-duration:.95s"/>
    <rect class="bar" x="392" y="190" width="16" height="40" rx="4" fill="#FF8A00" style="animation-delay:.75s;animation-duration:1.05s"/>
    <rect class="bar" x="416" y="190" width="16" height="40" rx="4" fill="#FFD400" style="animation-delay:.1s;animation-duration:.85s"/>
    <rect class="bar" x="440" y="190" width="16" height="40" rx="4" fill="#00E5C7" style="animation-delay:.35s;animation-duration:1.15s"/>
    <rect class="bar" x="464" y="190" width="16" height="40" rx="4" fill="#FF2E88" style="animation-delay:.55s;animation-duration:.9s"/>
    <rect class="bar" x="488" y="190" width="16" height="40" rx="4" fill="#FF8A00" style="animation-delay:.2s;animation-duration:1s"/>
    <rect class="bar" x="512" y="190" width="16" height="40" rx="4" fill="#FFD400" style="animation-delay:.4s;animation-duration:.8s"/>
    <rect class="bar" x="536" y="190" width="16" height="40" rx="4" fill="#00E5C7" style="animation-delay:.65s;animation-duration:1.1s"/>
  </g>
</svg>
